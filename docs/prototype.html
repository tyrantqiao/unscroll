<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unscroll · 产品交互稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eee9;color:#183e33;font:15px system-ui,"Microsoft YaHei",sans-serif}header{max-width:1150px;margin:40px auto 24px;padding:0 24px}header small{letter-spacing:3px}h1{font-size:40px;margin:14px 0}header p{color:#61756a;line-height:1.8}.layout{display:flex;gap:42px;justify-content:center;padding:10px 24px 50px;align-items:flex-start}.phone{width:390px;min-height:790px;border:8px solid #233e34;border-radius:44px;background:#fafbf6;overflow:hidden;box-shadow:0 24px 60px #183e3320;flex-shrink:0}.status{display:flex;justify-content:space-between;padding:16px 22px;font-size:12px}.page{padding:24px;min-height:652px}.eyebrow{font-size:12px;color:#678475}h2{font-size:28px;line-height:1.35;margin:10px 0 24px}.card{padding:20px;background:white;border:1px solid #e2e9df;border-radius:22px;margin:14px 0}.hero{background:#dcebdd}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:12px;background:#e2f0e4;padding:6px 10px;border-radius:30px}.num{font-size:54px;letter-spacing:-3px;margin:16px 0 6px}.muted{color:#748176;font-size:13px;line-height:1.8}.bar{height:6px;background:#e8ece3;border-radius:8px;margin:14px 0}.bar i{display:block;width:58%;background:#447a5c;height:100%;border-radius:8px}button{font:inherit;border:0;cursor:pointer;border-radius:15px;padding:14px 18px;background:#1d503e;color:white;min-height:48px}button.secondary{background:#e9eee3;color:#244e3d}button.text{background:transparent;color:#40634e}.wide{width:100%;margin-top:12px}nav{display:flex;border-top:1px solid #e0e7db;padding:8px;justify-content:space-around}nav button{background:transparent;color:#5f7765;font-size:13px}aside{width:340px;padding-top:30px}aside h3{font-size:22px}aside p{line-height:1.9;color:#617566}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button{background:white;color:#244e3d;border:1px solid #d4dfd0}label{display:block;margin:20px 0 8px;font-size:13px}input,select{width:100%;padding:14px;border:1px solid #d9e3d5;border-radius:12px;background:white;font:inherit;color:#1d503e}.center{text-align:center;padding-top:55px}.circle{width:190px;height:190px;border:9px solid #d9e8d8;border-radius:50%;margin:35px auto;display:flex;align-items:center;justify-content:center;font-size:44px}.warning{background:#f8efd8;color:#75602b;padding:16px;border-radius:18px;line-height:1.7}.hidden{display:none}a{color:#244e3d}@media(max-width:780px){.layout{flex-direction:column;align-items:center}.phone{width:min(390px,100%)}aside{width:min(390px,100%)}h1{font-size:30px}}
</style><header><small>UNSCROLL / PRODUCT DESIGN 01</small><h1>停下来，把时间拿回来。</h1><p>Android · 优先适配 OPPO Find X8 Ultra / ColorOS<br>可点击界面稿 · 示例数据 · 不执行真实监测或锁屏</p></header><main class="layout"><section class="phone"><div class="status"><b>9:41</b><span>▮▮▮　Wi-Fi　▰</span></div><div id="content"></div><nav><button onclick="show('home')">◉ 今日</button><button onclick="show('rules')">☷ 规则</button><button onclick="show('settings')">⚙ 设置</button></nav></section><aside><span class="eyebrow">交互走查</span><h3>从边界，到一次主动停下</h3><p>先为应用设定规则。到达提醒阈值时轻轻提醒；到达中断阈值时进入休息页。系统锁屏是需要真机验证的可选动作。</p><div class="controls"><button onclick="show('home')">01 今日首页</button><button onclick="show('rules')">02 编辑规则</button><button onclick="show('reminder')">03 到点提醒</button><button onclick="show('break')">04 休息中断</button><button onclick="show('settings')">05 适配自检</button><button onclick="show('lock')">06 锁屏示意</button></div><p id="note" aria-live="polite"></p><p><a href="product-design-v0.1.md">查看完整产品设计文档 ↗</a></p><p>建议默认：15 分钟提醒 → 20 分钟中断 → 5 分钟休息。短暂离开保留计时。冷静期只限制目标应用，手机其他功能保持可用。</p></aside></main><script>
let rule={warn:15,stop:20,cool:5,lock:false},timer;const el=document.getElementById('content');const notes={home:'首页把“今天用了多久”和“保护是否有效”放在一起。',rules:'规则保存后即时生效；时间输入会校验大小关系。',reminder:'继续使用保留本轮用量，不重置计时。',break:'休息倒计时仅为页面演示；回到桌面不会真的操作手机。',settings:'所有权限状态均为示例，实际状态需要 Android 客户端检测。',lock:'浏览器仅展示锁屏效果说明，不会关闭设备屏幕。'};
function show(page){clearInterval(timer);document.getElementById('note').textContent=notes[page];let html='';if(page==='home')html=`<div class="page"><div class="row"><b>unscroll</b><span class="pill">● 保护运行中 · 示例</span></div><h2>今天，给自己<br>留一点空白。</h2><div class="card hero"><span class="eyebrow">受控应用 · 今日累计</span><div class="num">38 <span style="font-size:20px;letter-spacing:0">分钟</span></div><p class="muted">完成了 2 次休息 · 示例数据</p></div><div class="card"><div class="row"><b>抖音</b><span class="pill">本轮 12 分钟</span></div><div class="bar"><i></i></div><p class="muted">${rule.warn} 分钟提醒 · ${rule.stop} 分钟中断</p><button class="text" onclick="show('rules')">调整边界 →</button></div><div class="card"><div class="row"><b>小红书</b><span class="muted">今日 14 分钟</span></div><p class="muted">15 分钟提醒 · 20 分钟中断</p></div></div>`;
if(page==='rules')html=`<div class="page"><span class="eyebrow">我的边界 / 抖音</span><h2>先决定，<br>刷多久刚刚好。</h2><label for="warn">连续使用多久提醒（分钟）</label><input id="warn" type="number" min="1" max="240" value="${rule.warn}"><label for="stop">连续使用多久中断（分钟）</label><input id="stop" type="number" min="2" max="300" value="${rule.stop}"><label for="cool">中断后休息（分钟）</label><input id="cool" type="number" min="1" max="60" value="${rule.cool}"><label for="mode">中断方式</label><select id="mode"><option value="break">显示休息页</option><option value="lock" ${rule.lock?'selected':''}>休息页 + 系统锁屏（待测试）</option></select><p class="muted">离开不足 ${rule.cool} 分钟，仍保留本轮计时。系统锁屏需单独开启权限和设备测试。</p><p id="error" role="alert" class="muted"></p><button class="wide" onclick="save()">保存我的规则</button></div>`;
if(page==='reminder')html=`<div class="page center"><span class="pill">抖音 · 单轮提醒</span><h2 style="margin-top:45px">抬头一下，<br>时间已经走了一会儿。</h2><div class="circle">${rule.warn}:00</div><p class="muted">已经刷了 ${rule.warn} 分钟。<br>还有 ${rule.stop-rule.warn} 分钟，就到休息时间。</p><button class="wide" onclick="show('break')">现在休息</button><button class="secondary wide" onclick="show('home')">继续到 ${rule.stop} 分钟</button></div>`;
if(page==='break'){html=`<div class="page center"><span class="eyebrow">抖音 / 冷静期</span><h2>这一轮，到这里。</h2><p class="muted">休息一会儿，再决定要不要继续。</p><div class="circle" id="count">${String(rule.cool).padStart(2,'0')}:00</div><p class="muted">冷静期内重新打开抖音，仍会回到这里。<br>其他应用可以正常使用。</p><button class="wide" onclick="show('home')">回到桌面（演示）</button><button class="text wide" onclick="emergency()">紧急使用 · 等待 10 秒后确认</button><p class="muted" id="emergency"></p></div>`;}
if(page==='settings')html=`<div class="page"><span class="eyebrow">设备适配 / 状态示例</span><h2>保护，需要<br>系统一起配合。</h2><div class="card"><b>OPPO Find X8 Ultra</b><p class="muted">ColorOS / Android 实际版本待确认</p></div><div class="card"><div class="row"><b>使用情况访问</b><span class="pill">示例：已开启</span></div><p class="muted">用于读取应用用量</p><div class="row"><b>无障碍服务</b><span class="pill">示例：已开启</span></div><p class="muted">用于识别目标应用与展示中断</p><div class="row"><b>系统锁屏</b><span class="muted">待真机验证</span></div></div><div class="warning">后台运行是否稳定，需测试省电模式、清理最近任务和重启。菜单路径随 ColorOS 版本确认。</div><button class="wide" onclick="show('reminder')">查看测试提醒示意</button></div>`;
if(page==='lock')html=`<div class="page center" style="background:#17392f;color:#e9f0e3"><span class="eyebrow" style="color:#acc6b5">系统锁屏 / 示意</span><h2 style="margin-top:85px">屏幕暗下来，<br>把注意力还给自己。</h2><div class="circle" style="border-color:#365e4a">☾</div><p style="line-height:1.9">实际应用在用户授权后尝试一次锁屏。<br>解锁后，手机可以继续使用；<br>抖音仍处于 ${rule.cool} 分钟冷静期。</p><button class="secondary wide" onclick="show('break')">模拟解锁并重开抖音</button></div>`;
el.innerHTML=html;if(page==='break'){let seconds=rule.cool*60;timer=setInterval(()=>{seconds--;const c=document.getElementById('count');if(c)c.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){clearInterval(timer);if(c)c.textContent='可继续';}},1000);}}
function save(){const w=Number(document.getElementById('warn').value),s=Number(document.getElementById('stop').value),c=Number(document.getElementById('cool').value);if(![w,s,c].every(Number.isInteger)||w<1||w>240||s<=w||s>300||c<1||c>60){document.getElementById('error').textContent='请填写整数：提醒 1–240 分钟，中断需大于提醒且不超过 300 分钟，休息 1–60 分钟。';return}rule={warn:w,stop:s,cool:c,lock:document.getElementById('mode').value==='lock'};show('home');document.getElementById('note').textContent='规则已保存至本次原型演示；刷新页面恢复默认。'}
function emergency(){const target=document.getElementById('emergency');target.textContent='紧急放行：等待 10 秒…';setTimeout(()=>{if(!target.isConnected)return;target.innerHTML='<button class="secondary" onclick="show(\'home\');document.getElementById(\'note\').textContent=\'演示：临时放行 3 分钟，真实额度由客户端记录。\'">确认临时使用 3 分钟（演示）</button>';},10000)}show('home');
</script></html>
